[[dependencies.squadmc]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"


[[dependencies.squadmc]]
modId = "superbwarfare"
mandatory = true
