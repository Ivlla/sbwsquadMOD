
modLoader = "javafml"

loaderVersion = "${loader_version_range}"

license = "${mod_license}"

[[mods]]

modId = "squadmc"

version = "${mod_version}"

displayName = "SquadMcVehicles"

authors = "Ivlla"



description = '''This a mod for SquadMC Server.
Helicopters are based on Frontline Combat Pack by Commissar_Mado (modified, see FCP_LICENSE.txt):
https://github.com/CommissarMado/Frontline-Combat-Pack
Squad helicopter and weapon sounds come from that pack.
Explosion effects are based on the MTS Official Pack by DonBruce64'''

[[dependencies.squadmc]] #optional
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}" #mandatory
ordering = "NONE"
